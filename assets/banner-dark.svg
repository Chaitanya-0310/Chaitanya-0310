<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Chaitanya Panchal, AI Engineer, building RAG systems and agentic workflows">
<style>
  .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9098A9; }
  .small { font-size: 13px; letter-spacing: .02em; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 66px 62px; }
  .halo { animation: halo 3s ease-in-out infinite; transform-origin: 935px 178px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes halo { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.35); opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .halo { animation: none; } }
</style>
<defs>
