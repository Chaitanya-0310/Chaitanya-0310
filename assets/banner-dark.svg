<text x="56" y="158" class="sans" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#ECEEF2">Chaitanya Panchal</text>
<text x="58" y="208" class="sans" font-size="26" font-weight="600" fill="#FF7A45">AI Engineer<tspan fill="#ECEEF2" font-weight="400"> — RAG systems, agents, and the data under them.</tspan></text>
<text x="58" y="246" class="sans" font-size="18" fill="#9098A9">I build LLM applications that cite their sources, pass their evals, and keep a human in the loop.</text>

